services:

  api:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma db push && npx prisma db seed && npm run dev"

  postgres:
    image: postgres:16
    container_name: job-portal-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: jobportal
    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d jobportal -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # image: redis:7
    image: redis/redis-stack:latest
    container_name: job-portal-redis
    ports:
      - "6379:6379"
      - "8001:8001"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres-data: